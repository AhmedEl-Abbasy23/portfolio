name: portfolio
description: "Ahmed Elabbasy - Portfolio."


publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
#  flutter_screenutil: ^5.9.3
  responsive_framework: ^1.5.1
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  skeletonizer: ^1.4.3
  flutter_svg: ^2.0.7
  carousel_slider: ^5.1.1
  lottie: ^3.1.3
  flutter_smart_dialog: ^4.8.2
  url_launcher: ^6.3.1
  flutter_slidable: ^4.0.0
  animate_do:
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  get_it: ^8.0.2
  shared_preferences: ^2.3.2
  font_awesome_flutter: ^10.8.0
  rive_animated_icon: ^2.0.5
  dropdown_button2: ^2.3.9
  animated_text_kit: ^4.2.3
  flutter_carousel_widget: ^3.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:
  injectable_generator:

flutter_gen:
  output: lib/core/resources/
  line_length: 80
  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/projects/accura_whats/
    - assets/images/projects/badraq/
    - assets/images/projects/bank_teller/
    - assets/images/projects/borza/
    - assets/images/projects/el_ryad_rms/
    - assets/images/projects/elagk_pharmacy/
    - assets/images/projects/fixxil/
    - assets/images/projects/fixxil_dashboard/
    - assets/images/projects/hr_plus/
    - assets/images/projects/itikaf/
    - assets/images/projects/maarod/
    - assets/images/projects/nano_dhp_customers/
    - assets/images/projects/nano_dhp_doctors/
    - assets/images/projects/nano_dhp_supervisors/
    - assets/images/projects/nano_driver/
    - assets/images/projects/osrna/
    - assets/images/projects/pawsket/
    - assets/images/projects/pawsket_delivery/
    - assets/images/projects/qabilt_esltah/
    - assets/images/projects/qeyas/
    - assets/images/projects/quran_kareem/
    - assets/images/projects/saaf_capital/
    - assets/images/projects/saudi_extreme_calendar/
    - assets/images/projects/sudan_care/
    - assets/images/projects/treater_doctor/
    - assets/images/projects/treater_patient/
    - assets/images/projects/u_a_e_store/
    - assets/images/projects/ureview/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - assets/data/projects.json

  fonts:
    - family: Ping
      fonts:
        - asset: assets/fonts/Ping-Black.otf
          weight: 900
        - asset: assets/fonts/Ping-Bold.otf
          weight: 700
        - asset: assets/fonts/Ping-Medium.otf
          weight: 600
        - asset: assets/fonts/Ping-Regular.otf
          weight: 500
        - asset: assets/fonts/Ping-Light.otf
          weight: 400
